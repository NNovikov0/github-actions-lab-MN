- name: Run SQL migrations
  env:
    DB_HOST: ${{ secrets.DB_HOST }}
    DB_NAME: ${{ secrets.DB_NAME }}
    DB_USER: ${{ secrets.DB_USER }}
    DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  run: |
    echo "DB_HOST is: $DB_HOST"
    echo "DB_NAME is: $DB_NAME"
    echo "DB_USER is: $DB_USER"
    echo "Password length: ${#DB_PASSWORD}"
    
    # Try to ping the host
    ping -c 3 "$DB_HOST" || echo "Cannot ping host"
    
    # Try telnet to port 3306
    timeout 5 bash -c "</dev/tcp/$DB_HOST/3306" && echo "Port 3306 is open" || echo "Cannot connect to port 3306"